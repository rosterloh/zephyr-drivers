common:
  tags:
    - drivers
    - sensor
  # No Xtensa ESP /qemu board: float code traps EXCCAUSE 32 there (Zephyr never sets CPENABLE on ESP).
  platform_allow:
    - qemu_cortex_m3
    - native_sim
    - adafruit_qt_py_esp32c3/esp32c3/qemu

tests:
  drivers.sensor.ina3221: {}
  drivers.sensor.ina3221.sync_only:
    extra_configs:
      - CONFIG_SENSOR_ASYNC_API=n
