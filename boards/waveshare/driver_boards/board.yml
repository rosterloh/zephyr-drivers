# Two Waveshare ESP32 driver boards sharing one directory, and therefore one
# board.cmake, one Kconfig, one doc/ and one waveshare_driver_common.dtsi.
#
# They are separate products with separate board names, not variants of one
# board: different ESP32 module (N4 vs N16), different flash size, different
# IMU, and only general_driver carries a microSD slot. Zephyr's `variants:` would
# not help -- a variant needs its own complete .dts and its own _defconfig, so
# it shares nothing that a #include does not already share, while renaming
# every board target in every consuming repository.
boards:
  - name: ros_driver
    full_name: Waveshare ROS Driver for Robots
    vendor: waveshare
    socs:
      - name: esp32
  - name: general_driver
    full_name: Waveshare General Driver for Robots
    vendor: waveshare
    socs:
      - name: esp32
