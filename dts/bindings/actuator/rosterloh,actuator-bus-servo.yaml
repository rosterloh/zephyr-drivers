description: Waveshare/SCServo bus-servo actuator

compatible: "rosterloh,actuator-bus-servo"

include: [actuator-common.yaml]

properties:
  reg:
    type: int
    required: true
    description: Servo bus ID.

  ticks-per-rev:
    type: int
    default: 4096

  rad-zero-tick:
    type: int
    default: 2047

  position-min-rad-milli:
    type: int
    description: |
      Lower travel limit in milliradians. OMITTING THIS MEANS UNLIMITED TRAVEL,
      not a safe default: the driver substitutes INT32_MIN, which rad_to_ticks()
      reads as the "no limit" sentinel and skips the clamp entirely. A node that
      forgets it drives the servo into its mechanical stop with no build error
      and no runtime error -- only the LOG_WRN that bus_servo_actuator_init()
      emits when either limit is absent.

      This is deliberately not `required: true`. A board devicetree may legally
      create the servo node for a connector it carries while knowing nothing
      about what is plugged into it, leaving the measured geometry to the
      application overlay; requiring the property here would make every such
      board unbuildable by any application that does not describe a head.

      Set it from a measurement, not a datasheet. rad_to_ticks() clamps to this
      range SILENTLY, so a too-narrow value is invisible from the host and
      presents as missing travel.

  position-max-rad-milli:
    type: int
    description: |
      Upper travel limit in milliradians. Absent means unlimited; see
      position-min-rad-milli for why that is a trap and why neither limit is
      required.

  invert-position:
    type: boolean
    description: |
      Flip the sign of the joint's positive sense relative to the servo's.

      This is a property of how the joint is assembled, not of the controller,
      so it belongs wherever the rest of the measured geometry lives. Note that
      a devicetree boolean cannot be un-set by a later fragment -- an overlay
      that needs it off must use `/delete-property/ invert-position;` -- which
      is the main reason a board devicetree should not assert it on behalf of
      an application.

  speed:
    type: int
    default: 300
    description: Position move speed passed to bus_servo_write_position_ex.

  accel:
    type: int
    default: 20
    description: Position move acceleration passed to bus_servo_write_position_ex.

  stall-torque-milli-nm:
    type: int
    default: 0
    description: |
      Stall torque in milli-newton-metres, used to convert the servo's
      present-load register (per-mille of stall torque) into the newton-metres
      the actuator effort feedback is defined in. 0, the default, leaves effort
      unreported rather than publishing a percentage as a torque.

      This is supply-dependent, not a part number: an ST3215 is quoted at
      30 kg*cm (2942) at 12 V but roughly 19 kg*cm (1863) at 7.4 V. Measure or
      derate it for the rail the servo actually runs on.
