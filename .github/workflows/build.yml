name: Zephyr Twister Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * SUN" # every sunday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # A cancelled run saves no ccache, and new PRs can only restore main's
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: pip install clang-format

      - name: Check formatting
        shell: bash
        run: |
          set -e
          files=$(git ls-files '*.c' '*.h' | grep -v '^twister-out' || true)
          if [ -z "$files" ]; then
            echo "No C files to check"
            exit 0
          fi
          echo "$files" | xargs clang-format --dry-run --Werror

      # Zephyr's dts-linter with the flags its own CI uses (check_compliance.py).
      # .github/west.yml tracks Zephyr main, so fetch scripts/ci from there.
      - name: Fetch Zephyr scripts/ci
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/zephyrproject-rtos/zephyr "$RUNNER_TEMP/zephyr"
          git -C "$RUNNER_TEMP/zephyr" sparse-checkout set scripts/ci
          npm ci --prefix "$RUNNER_TEMP/zephyr/scripts/ci" --ignore-scripts --no-audit --no-fund

      - name: Check devicetree formatting
        shell: bash
        run: |
          git ls-files '*.dts' '*.dtsi' '*.overlay' | sed 's/^/--file=/' | xargs \
            npx --prefix "$RUNNER_TEMP/zephyr/scripts/ci" --no dts-linter -- \
            --format --enableSortNodesAndProperties --sortNodesNodesBy address

  build:
    strategy:
      fail-fast: false
      matrix:
#        os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: zephyr-drivers

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Copy west.yml
        shell: bash
        run: |
          cp zephyr-drivers/.github/west.yml zephyr-drivers/west.yml

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zephyr-drivers
          ccache-max-size: 1GB
          toolchains: arm-zephyr-eabi:x86_64-zephyr-elf:riscv64-zephyr-elf:xtensa-espressif_esp32_zephyr-elf:xtensa-espressif_esp32s3_zephyr-elf

      # protoc for nanopb; imgtool signs the MCUboot-enabled ESP32 appcpu images;
      # aioesphomeapi (pinned to api.proto's tag) drives the esphome_api sample's pytest
      # py-opendisplay (the version Home Assistant pins) drives the opendisplay sample's pytest
      - name: Install extra Python tools
        run: pip install grpcio-tools imgtool aioesphomeapi==46.25.1 py-opendisplay==7.18.1

      # For the ESP /qemu platforms that --all selects. Same release as
      # zephyr-applications' qemu-install task; the apt list is the binaries'
      # DT_NEEDED minus what the runner image already has.
      - name: Install Espressif QEMU
        env:
          GH_TOKEN: ${{ github.token }}
          REL: esp-develop-9.2.2-20260417
          VER: esp_develop_9.2.2_20260417
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libslirp0 libpixman-1-0 libgcrypt20
          dest="$RUNNER_TEMP/qemu-espressif"
          mkdir -p "$dest"
          cd "$RUNNER_TEMP"
          for t in xtensa riscv32; do
            tarball="qemu-${t}-softmmu-${VER}-x86_64-linux-gnu.tar.xz"
            gh release download "$REL" --repo espressif/qemu -p "$tarball" -p '*checksum.sha256' --clobber
            grep -F " *${tarball}" ./*checksum.sha256 | sha256sum -c -
            tar -xf "$tarball"
            cp -R qemu/. "$dest/"
            rm -rf qemu
          done
          "$dest/bin/qemu-system-riscv32" --version | head -1
          echo "ESPRESSIF_QEMU_PATH=$dest/bin" >> "$GITHUB_ENV"

      - name: Twister Tests
        working-directory: zephyr-drivers
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          # PRs build integration platforms only; main and the weekly run cover every platform_allow entry
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--integration"
          else
            SCOPE="--all"
          fi
          west twister -T tests -T samples -v --inline-logs $SCOPE $EXTRA_TWISTER_FLAGS

  # On PRs, only when a board could have changed; main and the weekly run always build them
  board-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(gh pr diff "${{ github.event.number }}" --name-only --repo "$GITHUB_REPOSITORY")
            if ! grep -qE '^(boards|dts|\.github)/' <<< "$changed"; then
              echo "No board, devicetree or CI changes, skipping board smoke builds"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Boards with no test targeting them would otherwise never be compiled.
  # Own job so it runs beside twister instead of after it.
  boards:
    name: board smoke builds
    needs: board-changes
    if: needs.board-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: zephyr-drivers

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Copy west.yml
        run: cp zephyr-drivers/.github/west.yml zephyr-drivers/west.yml

      # Separate ccache key so this job's entries don't shadow twister's
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zephyr-drivers
          ccache-cache-key: boards
          ccache-max-size: 1GB
          toolchains: arm-zephyr-eabi:x86_64-zephyr-elf:riscv64-zephyr-elf:xtensa-espressif_esp32_zephyr-elf:xtensa-espressif_esp32s3_zephyr-elf

      # imgtool signs the MCUboot-enabled ESP32 appcpu images
      - name: Install imgtool
        run: pip install imgtool

      - name: Board smoke builds
        working-directory: zephyr-drivers
        run: |
          platforms=$(grep -h '^identifier:' boards/*/*/*.yaml | awk '{print "-p " $2}')
          west twister -T ../zephyr/samples/hello_world --build-only -v --inline-logs \
            -O twister-out-boards $platforms
