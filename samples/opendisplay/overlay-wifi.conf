# LAN transport over Wi-Fi: set the SSID and password, or use the
# "wifi cred" shell commands with WIFI_CREDENTIALS_BACKEND_SETTINGS.
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="my-network"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="my-password"
CONFIG_OPENDISPLAY_LAN=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="opendisplay"
CONFIG_NET_HOSTNAME_UNIQUE=y
