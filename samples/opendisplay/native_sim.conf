# native_sim: LAN only, over the host's sockets (NSOS). Used in place of
# prj.conf: there is no BLE controller or display hardware.
CONFIG_DISPLAY=y
CONFIG_OPENDISPLAY=y
CONFIG_OPENDISPLAY_ZLIB=y
CONFIG_LOG=y
CONFIG_SDL_DISPLAY=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_OPENDISPLAY_LAN=y
