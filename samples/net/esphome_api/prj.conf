CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y

# <hostname>.local is the device name Home Assistant shows.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="zephyr-esphome"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

CONFIG_ESPHOME_API=y
CONFIG_ESPHOME_API_FRIENDLY_NAME="Zephyr ESPHome sample"

CONFIG_LOG=y
